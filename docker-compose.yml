x-engine-env: &engine-env
  REDIS_URL: "redis://:${REDIS_PASSWORD:-devpassword123}@redis:6379/0"
  SUPABASE_URL: "${SUPABASE_URL:-http://nginx-postgrest:8080}"
  SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoib3h5LWxvY2FsIiwiaWF0IjoxNzc5ODI3NjgwLCJleHAiOjIwOTUxODc2ODB9.biEcQHccruu_BlAMM7A35eyl8Uauc2oa2B4PlaJ1ojk}"
  PYTHONPATH: /app
  # Browser origins allowed to call the engine (the UI). Comma-separated.
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"

services:
  redis:
    image: docker.io/library/redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # SECURITY: No ports exposed - Redis accessible only within Docker network
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-devpassword123}
      --appendonly yes
      --appendfsync everysec
      --save 900 1 --save 300 10 --save 60 10000
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --loglevel warning
      --dir /data
      --dbfilename dump.rdb
      --appendfilename "appendonly.aof"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword123}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      # The password reaches redis-cli through REDISCLI_AUTH, from the container's
      # environment ($$ keeps compose from writing it into the command), and only
      # PONG counts: redis-cli exits 0 on NOAUTH and WRONGPASS too.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

  # ==========================================================================
  # POSTGRES - Local stand-in for hosted Supabase Postgres.
  # ==========================================================================
  # Auto-applies db/supabase-compat.sql (auth/vault/role shim) and
  # db/schema.sql via the standard /docker-entrypoint-initdb.d hook on first
  # boot. The compat shim provides the minimum Supabase surface the schema
  # depends on (auth.users, auth.uid()/jwt()/role(), vault.create_secret,
  # vault.decrypted_secrets, plus anon/authenticated/service_role roles).
  # ==========================================================================
  postgres:
    image: docker.io/library/postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-oxy}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      # Optional: PostgREST's password. Left empty, the first boot generates one.
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:-}
      # The vault's AES key (supabase-compat.sql reads current_setting('app.vault_key')).
      # Set it in .env for anything beyond local dev. It reaches Postgres through
      # postgresql.auto.conf (db/00-vault-key.sh, db/postgres-entrypoint.sh), never
      # through the command line, which `ps` shows to every user of the host.
      SUPABASE_VAULT_KEY: ${SUPABASE_VAULT_KEY:-oxy-local-vault-dev-key-please-override-in-prod}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    entrypoint: ["/bin/sh", "/usr/local/bin/oxy-postgres-entrypoint.sh"]
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run in lexicographic order on a fresh data dir:
      #   01-compat.sql  -> roles, auth schema, vault schema
      #   02-schema.sql  -> the golden schema referencing the above
      - ./db/postgres-entrypoint.sh:/usr/local/bin/oxy-postgres-entrypoint.sh:ro
      #   00-vault-key       -> the vault key, into postgresql.auto.conf
      - ./db/00-vault-key.sh:/docker-entrypoint-initdb.d/00-vault-key.sh:ro
      - ./db/supabase-compat.sql:/docker-entrypoint-initdb.d/01-compat.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      #   03-authenticator   -> PostgREST's password, generated per install
      - ./db/03-authenticator-password.sh:/docker-entrypoint-initdb.d/03-authenticator-password.sh:ro
      - db_secrets:/run/oxy-secrets
    healthcheck:
      # Over TCP: the first boot's init scripts run on a socket-only server, so this
      # turns healthy only once they are all done (schema, PostgREST's password).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oxy}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - default

  # ==========================================================================
  # POSTGREST - REST API over local Postgres (Supabase's REST layer, FOSS).
  # ==========================================================================
  # Connects as the `authenticator` role created by supabase-compat.sql and
  # SET ROLE's into anon/authenticated/service_role per request based on the
  # JWT claim. JWT secret is shared with the engine via env.
  # ==========================================================================
  postgrest:
    # Use Supabase's PostgREST fork, not the upstream image. They ship custom
    # patches (notably backward-compatible aggregate syntax — `field:sum(field)`
    # rather than upstream 12's `field.sum()`) that match the dialect every
    # `routes/*.py` query is written against. Switching to upstream PostgREST
    # was attempted; aggregate queries failed because `sum(field)` was parsed
    # as an FK-embed instead of an aggregate.
    image: postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
    environment:
      # Read from the file the database's first boot wrote (password generated per install).
      PGRST_DB_URI: "@/run/oxy-secrets/pgrst_db_uri"
      PGRST_DB_SCHEMAS: public,auth
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-oxy-local-dev-jwt-secret-32chars-min-please-override-in-prod}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Aggregate functions (sum/count/avg/min/max in `select=`) are opt-in
      # since PostgREST 12; many engine routes (attribution, intelligence,
      # cost-optimizer) rely on them, so enable explicitly.
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_LOG_LEVEL: info
    volumes:
      - db_secrets:/run/oxy-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    # PostgREST's official image is minimal (no shell, wget, or curl), so we
    # can't use the usual HTTP-probe healthcheck. Rely on start_period plus
    # downstream proxy validation via nginx-postgrest's healthcheck.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - default

  # ==========================================================================
  # GOTRUE - Supabase Auth Server (FOSS, MIT).
  # ==========================================================================
  # Issues JWTs signed with SUPABASE_JWT_SECRET (shared with PostgREST), so
  # tokens from signup/login flow through to PostgREST + RLS unchanged.
  # Writes to the `auth` schema in the same Postgres that PostgREST reads.
  #
  # Dev defaults: signup enabled, email auto-confirm (no SMTP required),
  # JWT expiry 1h. Override the GOTRUE_* env vars below for production.
  # ==========================================================================
  gotrue:
    image: supabase/gotrue:v2.164.0@sha256:f8b871f46f3f9c5306af00d2fb856fb5479db730bb6d4fd2757b2da8abe953f9
    environment:
      # API surface
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8080}

      # Database (runs migrations on first boot to add the rest of the auth
      # schema on top of what supabase-compat.sql already created).
      GOTRUE_DB_DRIVER:        postgres
      GOTRUE_DB_DATABASE_URL:  postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-oxy}?search_path=auth

      # Site/callback URLs (UI runs on host port 3000 in dev).
      GOTRUE_SITE_URL:           ${GOTRUE_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST:     ${GOTRUE_URI_ALLOW_LIST:-http://localhost:3000,http://localhost:3000/auth/callback}

      # JWT — must match PGRST_JWT_SECRET so PostgREST accepts GoTrue tokens.
      GOTRUE_JWT_SECRET:               ${SUPABASE_JWT_SECRET:-oxy-local-dev-jwt-secret-32chars-min-please-override-in-prod}
      GOTRUE_JWT_EXP:                  "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME:   authenticated
      GOTRUE_JWT_ADMIN_ROLES:          service_role
      GOTRUE_JWT_AUD:                  authenticated

      # Signup + email behaviour (dev: open signup, auto-confirm).
      GOTRUE_DISABLE_SIGNUP:       "false"
      GOTRUE_MAILER_AUTOCONFIRM:   "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM:      "true"

      # Sign-in is by magic link. Local mail goes to Mailpit; read it at
      # http://localhost:8025. Links point at the nginx adapter's /auth/v1.
      GOTRUE_SMTP_HOST:          ${GOTRUE_SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT:          ${GOTRUE_SMTP_PORT:-1025}
      GOTRUE_SMTP_USER:          ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS:          ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL:   ${GOTRUE_SMTP_ADMIN_EMAIL:-oxy@localhost}
      GOTRUE_SMTP_SENDER_NAME:   Oxy
      GOTRUE_MAILER_URLPATHS_INVITE:       /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY:     /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_MAGIC_LINK:   /auth/v1/verify
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - default

  # ==========================================================================
  # NGINX-POSTGREST - recreates the Supabase URL shape over our local stack.
  # ==========================================================================
  # The engine and UI both speak the Supabase URL dialect:
  #   <base>/rest/v1/<table>  -> PostgREST
  #   <base>/auth/v1/<path>   -> GoTrue
  # Rather than patch dozens of call sites, this single tiny nginx serves
  # both upstreams under the expected prefixes. Exposed on host port 8080
  # so the browser-side supabase-js client can reach it directly. Engine
  # env: SUPABASE_URL=http://nginx-postgrest:8080 (docker network name).
  # ==========================================================================
  # ==========================================================================
  # MAILPIT - catches GoTrue's sign-in mail locally (web UI on :8025).
  # Anyone who can open it can read sign-in links, so like every port of this
  # dev stack it is published on 127.0.0.1 only.
  # ==========================================================================
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:8025:8025"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - default

  nginx-postgrest:
    image: docker.io/library/nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/postgrest.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      postgrest:
        condition: service_started
      gotrue:
        condition: service_started
    # Probes both nginx itself (via /healthz) and the upstream PostgREST
    # connection (via the `/rest/v1/` proxy path). When this is healthy,
    # the engine can rely on the full chain being ready.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 && wget -qO- http://127.0.0.1:8080/rest/v1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - default

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
    depends_on:
      redis:
        condition: service_healthy
      nginx-postgrest:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default

  worker-logs:
    build:
      context: .
      dockerfile: Dockerfile.engine
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.log_worker
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "touch", "/tmp/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  worker-budget:
    build:
      context: .
      dockerfile: Dockerfile.engine
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.budget_worker
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "touch", "/tmp/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  worker-webhook-retry:
    build:
      context: .
      dockerfile: Dockerfile.engine
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
      INTERNAL_API_URL: "http://engine:8000"
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.webhook_retry_worker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "touch", "/tmp/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  worker-cost-anomaly:
    build:
      context: .
      dockerfile: Dockerfile.engine
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.cost_anomaly_detector
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "touch", "/tmp/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default

  worker-intelligence:
    build:
      context: .
      dockerfile: Dockerfile.engine
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
      INTELLIGENCE_RUN_MODE: "schedule"
      INTELLIGENCE_INTERVAL: "86400"
      INTELLIGENCE_RUN_HOUR: "2"
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.intelligence_scheduler
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    # Keep custom Redis healthcheck for this worker, it is valid
    healthcheck:
      # REDIS_URL from the container's environment: a URL written into the test
      # would put the password on the command line of every check.
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

  # ==========================================================================
  # 🛡️ AGENT ANOMALY DETECTOR (AI Security Worker)
  # ==========================================================================
  # Continuously monitors AI agents for anomalous behavior:
  # - Burst requests, sustained high volume
  # - Budget spikes, DLP violations
  # - Stuck sessions, looping behavior
  # - High-risk tool usage
  # 
  # CRITICAL: This is a security-critical worker. Keep running 24/7.
  # ==========================================================================
  worker-anomaly:
    build:
      context: .
      dockerfile: Dockerfile.engine
    volumes:
      - ./packages/engine:/app
      - /app/venv
    env_file:
      - path: ./packages/engine/.env
        required: false
    environment:
      <<: *engine-env
      # Anomaly detection configuration
      ANOMALY_RUN_MODE: "continuous"
      ANOMALY_DETECTION_INTERVAL: "60"
      ANOMALY_BURST_THRESHOLD: "50"
      ANOMALY_SUSTAINED_THRESHOLD: "500"
      ANOMALY_TOOL_CALL_THRESHOLD: "100"
      ANOMALY_BUDGET_SPIKE_THRESHOLD: "50"
      ANOMALY_SESSION_TIMEOUT_HOURS: "2"
      ANOMALY_DLP_THRESHOLD: "5"
      # Alert configuration (set webhook URL in .env for production)
      ANOMALY_WEBHOOK_ENABLED: "true"
      ANOMALY_EMAIL_ENABLED: "false"
      ANOMALY_AUTO_PAUSE_ENABLED: "false"
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.anomaly_scheduler
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      # REDIS_URL from the container's environment: a URL written into the test
      # would put the password on the command line of every check.
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      target: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/ui/node_modules
    env_file:
      - path: ./packages/ui/.env.local
        required: false
    # NEXT_PUBLIC_* values are baked into client bundles, so they need to be
    # reachable from the browser (host port 8080). For server-side rendering
    # the UI container also resolves `localhost` via host-gateway thanks to
    # `extra_hosts` below, so the same URL works in both contexts on Docker
    # Desktop and Linux.
    environment:
      - INTERNAL_API_URL=http://engine:8000
      - INTERNAL_SUPABASE_URL=http://nginx-postgrest:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8080}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6Im94eS1sb2NhbCIsImlhdCI6MTc3OTgyNzY4MCwiZXhwIjoyMDk1MTg3NjgwfQ.-TYToRGOj3afRdVjEZn_XPaQe24seO5ZcBPRpLop2hk}
    extra_hosts:
      # On Docker Desktop and Linux (with --add-host=host.docker.internal:host-gateway)
      # this maps `localhost` inside the container to the docker host's
      # gateway IP, so server-side SupabaseClient calls reach the host-
      # mapped nginx on :8080 the same way browser calls do.
      - "host.docker.internal:host-gateway"
    working_dir: /app/packages/ui
    command: pnpm dev
    depends_on:
      engine:
        condition: service_healthy
      nginx-postgrest:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  # PostgREST's connection string with the per-install authenticator password.
  db_secrets:
    driver: local