# Keeps the pinned GitHub Actions, the engine's and UI's dependencies and the
# Dockerfiles' base images current.
#
# Grouped, patch and minor only: one pull request per ecosystem per week, and
# .github/workflows/dependabot-automerge.yml merges it once CI (proofs and the
# devcontainer included) and CodeQL pass for its commit. Major versions are not
# proposed: each is a migration made by hand, in its own pull request. The
# README's "Dependencies" section lists the majors held back and the date they
# are next reviewed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /packages/engine
    schedule:
      interval: weekly
    groups:
      engine:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  # pnpm workspace: the root reads pnpm-workspace.yaml and updates packages/ui
  # with pnpm-lock.yaml. Listing /packages/ui as well opened a second pull
  # request for the same update, without the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      ui:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  # Base images of Dockerfile.engine and Dockerfile.ui. Python stays on 3.12
  # and Node on 22 (LTS): a new language line is a migration, not an update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "library/python"
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: deps
