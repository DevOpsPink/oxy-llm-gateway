name: Walkthrough

# Records the README's quickstart (scripts/walkthrough.sh) with asciinema on a
# clean runner: clone the public repository, `docker compose up -d --build
# --wait`, sign in by magic link, get an Oxy API key, get "pong". The cast is
# kept as an artifact; docs/walkthrough.gif is rendered from it with agg.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record the quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install asciinema (pinned by hash)
        run: |
          printf 'asciinema==2.4.0 --hash=sha256:249ccf108509d643ddaf38979dac48c99e9e251f597173d8553a30d7a6423104\n' > "$RUNNER_TEMP/req.txt"
          python3 -m pip install --quiet --require-hashes -r "$RUNNER_TEMP/req.txt"

      - name: Record
        working-directory: ${{ runner.temp }}
        env:
          SCRIPT: ${{ github.workspace }}/scripts/walkthrough.sh
        run: |
          asciinema rec --quiet --overwrite --cols 120 --rows 34 --idle-time-limit 2 \
            --title "Oxy: clean clone to pong" --command "bash $SCRIPT" walkthrough.cast
          tail -c 2000 walkthrough.cast | grep -q 'pong from Oxy Gateway'

      - name: Keep the cast
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough
          path: ${{ runner.temp }}/walkthrough.cast

      - name: Stop the stack
        if: always()
        working-directory: ${{ runner.temp }}/oxy-llm-gateway
        run: docker compose down -v || true
