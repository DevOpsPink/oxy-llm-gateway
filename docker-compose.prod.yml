# Production Docker Compose Configuration
# CRITICAL: Use this for production deployments with enhanced security
# Copy .env.example to .env and configure all secrets

services:
  redis:
    restart: unless-stopped
    # Time to write its data out (Redis AOF/RDB, Postgres checkpoint) before
    # Docker kills it; the default 10 s can cut a large save short.
    stop_grace_period: 30s
    image: docker.io/library/redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 900 1 --save 300 10 --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy volatile-lru
      --loglevel notice
      --dir /data
      --dbfilename dump.rdb
      --appendfilename "appendonly.aof"
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 300
      --supervised no
    environment:
      # For the health check (REDISCLI_AUTH); redis-server rewrites its own
      # command line at start, so --requirepass above does not stay in `ps`.
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - redis_logs:/var/log/redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      # The password reaches redis-cli through REDISCLI_AUTH, from the container's
      # environment ($$ keeps compose from writing it into the command), and only
      # PONG counts: redis-cli exits 0 on NOAUTH and WRONGPASS too.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  engine:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.engine
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    image: oxy-engine:${VERSION:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uvicorn main:app 
      --host 0.0.0.0 
      --port 8000 
      --workers 4
      --loop uvloop
      --no-access-log
      --proxy-headers
      --forwarded-allow-ips='*'
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  worker-logs:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: oxy-engine:${VERSION:-latest}
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.log_worker
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    # FIX: Disable healthcheck inherited from engine
    healthcheck:
      disable: true
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker-budget:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: oxy-engine:${VERSION:-latest}
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.budget_worker
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    # FIX: Disable healthcheck inherited from engine
    healthcheck:
      disable: true
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker-webhook-retry:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: oxy-engine:${VERSION:-latest}
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - INTERNAL_API_URL=http://engine:8000
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.webhook_retry_worker
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    # FIX: Disable healthcheck inherited from engine
    healthcheck:
      disable: true
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker-cost-anomaly:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: oxy-engine:${VERSION:-latest}
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.cost_anomaly_detector
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    # FIX: Disable healthcheck inherited from engine
    healthcheck:
      disable: true
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker-intelligence:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: oxy-engine:${VERSION:-latest}
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - INTELLIGENCE_RUN_MODE=schedule
      - INTELLIGENCE_INTERVAL=86400
      - INTELLIGENCE_RUN_HOUR=2
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.intelligence_scheduler
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    # Keep custom Redis healthcheck for this worker
    healthcheck:
      # REDIS_URL from the container's environment: a URL written into the test
      # would put the password on the command line of every check.
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ==========================================================================
  # 🛡️ AGENT ANOMALY DETECTOR (AI Security Worker)
  # ==========================================================================
  # Continuously monitors AI agents for anomalous behavior:
  # - Burst requests, sustained high volume
  # - Budget spikes, DLP violations
  # - Stuck sessions, looping behavior
  # - High-risk tool usage
  # 
  # CRITICAL: This is a security-critical worker. Keep running 24/7.
  # Auto-pause enabled in production for critical anomalies.
  # ==========================================================================
  worker-anomaly:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: oxy-engine:${VERSION:-latest}
    volumes:
      - app_logs:/app/logs
    env_file:
      - ./packages/engine/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      # Anomaly detection configuration
      - ANOMALY_RUN_MODE=continuous
      - ANOMALY_DETECTION_INTERVAL=60
      - ANOMALY_BURST_THRESHOLD=50
      - ANOMALY_SUSTAINED_THRESHOLD=500
      - ANOMALY_TOOL_CALL_THRESHOLD=100
      - ANOMALY_BUDGET_SPIKE_THRESHOLD=50
      - ANOMALY_SESSION_TIMEOUT_HOURS=2
      - ANOMALY_DLP_THRESHOLD=5
      # Alert configuration (PRODUCTION: Enable auto-pause for critical anomalies)
      - ANOMALY_WEBHOOK_ENABLED=true
      - ANOMALY_ALERT_WEBHOOK_URL=${ANOMALY_ALERT_WEBHOOK_URL:-}
      - ANOMALY_EMAIL_ENABLED=${ANOMALY_EMAIL_ENABLED:-false}
      - ANOMALY_AUTO_PAUSE_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    command: python -u -m workers.anomaly_scheduler
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    healthcheck:
      # REDIS_URL from the container's environment: a URL written into the test
      # would put the password on the command line of every check.
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ui:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.ui
      target: production
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    image: oxy-ui:${VERSION:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./packages/ui/.env.local
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://engine:8000
    command: pnpm --filter ./packages/ui start
    depends_on:
      engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

  caddy:
    image: docker.io/library/caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      - engine
      - ui
    networks:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    depends_on:
      - prometheus
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  redis_data:
    driver: local
  redis_logs:
    driver: local
  app_logs:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local