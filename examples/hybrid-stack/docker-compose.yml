version: "3.9"

services:
  oxy-engine:
    build:
      context: ../..
      dockerfile: Dockerfile.engine
    environment:
      SUPABASE_URL: http://supabase:8000
      SUPABASE_SERVICE_KEY: supabase_service_key
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8000:8000"

  redis:
    image: docker.io/library/redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - "6379:6379"

  vllm:
    image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    environment:
      - VLLM_MODEL=meta-llama/Llama-3-8b-chat-hf
    ports:
      - "8001:8000"

  # Cloud provider is external (OpenAI/Anthropic). Configure provider keys in Oxy.

networks:
  default:
    name: oxy-hybrid
