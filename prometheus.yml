# =============================================================================
# PROMETHEUS CONFIGURATION FOR OXY ENGINE
# =============================================================================
# Scrape configuration for the engine, Redis, Caddy and host metrics.
# =============================================================================

global:
  # How frequently to scrape targets
  scrape_interval: 15s
  
  # How long to wait before timing out a scrape
  scrape_timeout: 10s
  
  # How frequently to evaluate rules
  evaluation_interval: 15s
  
  # External labels to attach to any time series or alerts
  external_labels:
    cluster: 'oxy-engine'
    environment: 'production'
    service: 'api-gateway'

# Alertmanager configuration (optional but recommended)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - 'alertmanager:9093'  # Uncomment if using Alertmanager

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"  # Add alert rules here

# Scrape configurations
scrape_configs:
  # ============================================================================
  # PROMETHEUS SELF-MONITORING
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'

  # ============================================================================
  # OXY ENGINE API (FastAPI)
  # ============================================================================
  - job_name: 'oxy-engine'
    scrape_interval: 10s
    static_configs:
      - targets: ['engine:8000']
        labels:
          component: 'api'
          language: 'python'
          framework: 'fastapi'
    metrics_path: '/metrics'
    # Relabel to add custom labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'oxy-engine-api'

  # ============================================================================
  # REDIS EXPORTER
  # ============================================================================
  # Note: Requires redis_exporter sidecar container
  # Add to docker-compose.prod.yml:
  # redis-exporter:
  #   image: oliver006/redis_exporter:latest
  #   environment:
  #     - REDIS_ADDR=redis:6379
  #     - REDIS_PASSWORD=${REDIS_PASSWORD}
  #   ports:
  #     - "9121:9121"
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          component: 'cache'
          service: 'redis'
    # Uncomment when redis_exporter is added

  # ============================================================================
  # CADDY REVERSE PROXY
  # ============================================================================
  - job_name: 'caddy'
    scrape_interval: 30s
    static_configs:
      - targets: ['caddy:2019']  # Caddy admin API
        labels:
          component: 'proxy'
          service: 'caddy'
    metrics_path: '/metrics'

  # ============================================================================
  # NODE EXPORTER (System Metrics)
  # ============================================================================
  # Note: Requires node_exporter container
  # Add to docker-compose.prod.yml:
  # node-exporter:
  #   image: prom/node-exporter:latest
  #   ports:
  #     - "9100:9100"
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'
          service: 'node-exporter'
    # Uncomment when node_exporter is added

