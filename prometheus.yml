# =============================================================================
# METRICS WORTH WATCHING
# =============================================================================
# Spend:
# - oxy_budget_exceeded_total: requests refused because a budget was reached
# - oxy_cost_per_request: LLM spend per request
#
# Security:
# - oxy_threats_detected_total: DLP events
# - oxy_auth_failures_total: unauthorized access attempts
# - oxy_rate_limit_hits_total: rate-limit refusals
#
# Reliability:
# - oxy_circuit_breaker_open: upstream provider failures
# - oxy_request_duration_seconds: latency
# - oxy_cache_hit_rate: response-cache efficiency
#
# Usage:
# - oxy_tokens_processed_total: tokens through the gateway
# - oxy_projects_active: active projects
# - oxy_api_keys_created: API keys issued
