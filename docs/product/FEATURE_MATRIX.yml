- id: key-rotation
  label: Key Rotation
  landing:
    present: true
    sections: ["Features"]
    copy_snippet: "Key rotation reminders (age-based headers, optional enforcement)."
  status: ga
  product_contract:
    summary: Age-based key rotation hygiene with warnings and optional enforcement; Oxy nudges per thresholds but does not auto-rotate secrets.
    scope: ["security", "api"]
    guarantees: []
    configuration:
      fields:
        - key: mode
          type: enum
          description: "`off|warn|enforce` (KEY_ROTATION_MODE, default warn)."
        - key: warning_days
          type: integer
          description: "Start warning at this age (KEY_ROTATION_WARNING_DAYS, default 80)."
        - key: max_days
          type: integer
          description: "Expired threshold (KEY_ROTATION_MAX_DAYS, default 90)."
    behavior:
      - "Fresh (<warning): pass through."
      - "Warning (>=warning,<max): allow + headers (X-Oxy-Key-Rotation-Status/Age/Expires-In-Days/URL)."
      - "Expired (>=max): mode=warn → allow with status=expired; mode=enforce → block 403 with error.code=key_rotation_required."
    limitations:
      - "Hygiene/visibility only; does not rotate keys for you."
      - "Relies on timestamps; fails open on lookup errors."
  code_refs:
    - packages/engine/middleware/key_rotation.py
    - packages/ui/src/app/page.tsx  # badges/cards
    - packages/ui/src/app/dashboard/settings/org/page.tsx
    - packages/ui/src/app/docs/features/key-rotation/page.tsx
  tests:
