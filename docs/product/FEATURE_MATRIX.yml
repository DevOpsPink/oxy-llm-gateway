- id: geo-blocking
  label: Geo-Blocking / IP-Based Protections
  landing:
    present: false
  status: ga
  product_contract:
    summary: Header-first, IP-based middleware to block requests from configured countries/regions; best-effort signal, not sanctions advice.
    scope: ["security", "addons"]
    guarantees: []
    configuration:
      fields:
        - key: blocked_countries
          type: list
          description: "ISO country codes (env `GEO_BLOCKED_COUNTRIES`), configurable per deployment."
        - key: blocked_regions
          type: list
          description: "Optional region/state codes when provided via `X-Region-Code`."
        - key: fail_open_on_unknown
          type: boolean
          description: "Default allow + log when country is unknown; set `GEO_FAIL_OPEN_ON_UNKNOWN=false` to block."
        - key: headers
          type: list
          description: "Resolution order: CF-IPCountry > X-Country-Code > X-Geo-Country > X-Appengine-Country; optional IP lookup if enabled."
        - key: status_code
          type: integer
          description: "Default 451; 403 supported via `GEO_BLOCK_STATUS_CODE`."
    behavior:
      - "Blocked country/region -> 451 with error.code=geo_blocked and country/source in body."
      - "Unknown country -> allow + log by default; optionally block via fail-open flag."
      - "Health/metrics paths bypassed; logs avoid full IP (country+source only)."
    limitations:
      - "IP/header-based heuristic; VPNs/proxies can bypass or obfuscate."
      - "Not a sanctions/export-compliance engine; operators must maintain lists."
  code_refs:
    - packages/engine/middleware/geo_blocking.py
    - packages/ui/src/app/page.tsx  # enterprise features
    - packages/ui/src/app/docs/features/geo-blocking/page.tsx
    - packages/ui/src/app/dashboard/guardrails/page.tsx
  tests:
    - packages/engine/tests/test_middleware.py
  docs:
    - docs/security/geo-blocking.md
    - docs/security/ip-protection.md
  gap_analysis:
    risk_level: p1
    needs: []
    notes: "Geo/IP controls require configuration; effectiveness depends on deployment."

