# Feature matrix linking landing claims to implementation, tests, and docs.
# Status key: ga (generally available), beta (partially implemented or requires config), planned (not yet implemented).
# GA readiness criteria (use before setting status: ga):
# - Single, well-defined behavior and product contract (no conflicting code paths).
# - code_refs point to real implementation of that contract.
# - Automated tests exist for the happy path and common error conditions.
# - At least one doc page (new docs tree) explains what it does, how to configure it, and its limitations/caveats.
# - UI exposure is discoverable and not labeled/buried as “beta/experimental” if marked ga.
# - No hard SLAs (e.g., 99.9%, <5ms, 7-year) unless backed by enforceable contracts (assume none by default).

