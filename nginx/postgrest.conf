# nginx config that fronts both PostgREST and GoTrue, recreating the
# Supabase URL surface on a vanilla self-hosted stack:
#   /rest/v1/<path>  ->  PostgREST   /<path>
#   /auth/v1/<path>  ->  GoTrue      /<path>
#
# The Oxy engine and UI speak the Supabase dialect verbatim. This proxy
# keeps their code unchanged while we run on Postgres + PostgREST + GoTrue.
#
# Listens on :8080 inside the docker network and (when ports are mapped)
# on the host so the browser-side supabase-js client can reach it too.

events {}

http {
    # Aggressive timeouts so hung upstreams don't stall callers.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    upstream postgrest_upstream {
        server postgrest:3000;
        keepalive 32;
    }

    upstream gotrue_upstream {
        server gotrue:9999;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # PostgREST API surface (Supabase URL shape).
        location /rest/v1/ {
            # The UI calls this adapter from another origin (:3000 -> :8080).
            # Supabase's Kong gateway answers CORS for every origin; do the same.
            # Auth is bearer-token based, so no cookies cross origins.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
                add_header Access-Control-Max-Age       3600 always;
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin   "*" always;
            add_header Access-Control-Expose-Headers "Content-Range, Range-Unit, Location, X-Total-Count" always;
            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://postgrest_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Preserve Authorization/apikey/Prefer/Range — PostgREST and the
            # Supabase client rely on them.
            proxy_pass_request_headers on;
        }

        # GoTrue auth surface (Supabase URL shape).
        location /auth/v1/ {
            # The UI calls this adapter from another origin (:3000 -> :8080).
            # Supabase's Kong gateway answers CORS for every origin; do the same.
            # Auth is bearer-token based, so no cookies cross origins.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
                add_header Access-Control-Max-Age       3600 always;
                return 204;
            }
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin   "*" always;
            add_header Access-Control-Expose-Headers "Content-Range, Range-Unit, Location, X-Total-Count" always;
            rewrite ^/auth/v1/(.*)$ /$1 break;
            proxy_pass http://gotrue_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # GoTrue needs the original Authorization, apikey, and any
            # x-client-info / redirect-related headers verbatim.
            proxy_pass_request_headers on;
        }

        # Self-health (no upstream call) so the container has a fast
        # liveness probe target.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
