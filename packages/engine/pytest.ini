[pytest]
# Pytest configuration for Oxy Engine

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Filter external library deprecation warnings (narrow)
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension

# Markers
markers =
    smoke: Quick smoke tests for deployment verification
    integration: Integration tests requiring external services
    slow: Slow tests (>5 seconds)
    security: Security-focused tests
    financial: Tests for financial accuracy

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

