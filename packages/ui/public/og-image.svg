<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ============================================================================ -->
  <!-- OXY ENGINE - SOCIAL MEDIA PREVIEW IMAGE (OG/TWITTER CARD)                   -->
  <!-- ============================================================================ -->
  <!-- Design: Premium dark gradient with technical credibility signals            -->
  <!-- Format: SVG (scalable, 5KB vs PNG's 200KB+, version-controllable)           -->
  <!-- Rationale: dark background, shield = security                              -->
  <!-- Technical: Self-contained (no external fonts), optimized for social preview -->
  <!-- ============================================================================ -->
  
  <!-- Background: Dark Slate to Deep Purple Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient (Red to Orange - "Fire" theme) -->
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effect (Purple) -->
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background Fill -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Glow (subtle ambient light) -->
  <circle cx="600" cy="315" r="400" fill="url(#glowGradient)" opacity="0.6"/>
  
  <!-- Shield Icon (Security Symbol) - Top Left -->
  <g transform="translate(80, 80)">
    <!-- Shield outline -->
    <path d="M32 4L32 4C32 4 50 10 50 24C50 38 32 54 32 54C32 54 14 38 14 24C14 10 32 4 32 4Z" 
          stroke="#a855f7" 
          stroke-width="3" 
          fill="none"
          opacity="0.8"/>
    <!-- Inner shield fill -->
    <path d="M32 10C32 10 44 14 44 24C44 34 32 46 32 46C32 46 20 34 20 24C20 14 32 10 32 10Z" 
          fill="#7c3aed" 
          opacity="0.3"/>
    <!-- Checkmark -->
    <path d="M24 26L29 31L40 20" 
          stroke="#22c55e" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
  </g>
  
  <!-- Logo Text: "Oxy Engine" -->
  <text x="160" y="110" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="36" 
        font-weight="700" 
        fill="#ffffff"
        letter-spacing="-0.5">
    Oxy Engine
  </text>
  
  <!-- Main Headline: "Kill Switch for Rogue Agents" -->
  <text x="80" y="280" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="88" 
        font-weight="900" 
        fill="url(#fireGradient)"
        letter-spacing="-2">
    Kill Switch
  </text>
  
  <text x="80" y="370" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="88" 
        font-weight="900" 
        fill="#ffffff"
        letter-spacing="-2">
    for Rogue Agents
  </text>
  
  <!-- Subheadline: Agent Control Features -->
  <text x="80" y="440" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="32" 
        font-weight="600" 
        fill="#c084fc"
        letter-spacing="0">
    Per-Agent Budgets • Tool DLP • Cloud + Local Models
  </text>
  
  <!-- Kill Switch Badge (Bottom Right) -->
  <g transform="translate(970, 520)">
    <!-- Badge background -->
    <rect x="0" y="0" width="190" height="60" rx="8" fill="#dc2626" opacity="0.9"/>
    <!-- Power icon -->
    <circle cx="28" cy="30" r="12" stroke="#ffffff" stroke-width="2" fill="none"/>
    <line x1="28" y1="18" x2="28" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Badge text -->
    <text x="50" y="38" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" 
          font-weight="700" 
          fill="#ffffff"
          letter-spacing="0">
      Kill Switch &lt;5ms
    </text>
  </g>
  
  <!-- Decorative Grid Lines (subtle tech aesthetic) -->
  <g opacity="0.1">
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="430" x2="1200" y2="430" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Stop/Kill Symbol (Visual Reinforcement) -->
  <text x="680" y="375" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="72">
    🛑
  </text>
</svg>

