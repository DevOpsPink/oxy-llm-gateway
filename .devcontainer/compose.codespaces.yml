# Overlay for the devcontainer (with proofs/docker-compose.proofs.yml): one port,
# 3080, for the dashboard, GoTrue and PostgREST (as /auth/v1 and /rest/v1) and the
# engine (as /engine), so the page and every call it makes share one origin.
# start.sh points the public URLs at that origin.
services:
  demo-proxy:
    image: docker.io/library/nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - ./.devcontainer/demo-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      engine:
        condition: service_healthy
      nginx-postgrest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3080/engine/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - default

  ui:
    environment:
      # Next's dev server answers pages served through the proxy's host.
      - NEXT_ALLOWED_DEV_ORIGINS=${NEXT_ALLOWED_DEV_ORIGINS:-localhost}
