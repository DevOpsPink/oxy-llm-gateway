# One origin for the devcontainer demo (see compose.codespaces.yml).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3080;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;

    # GoTrue and PostgREST, through the stack's own adapter
    location /auth/v1/ { proxy_pass http://nginx-postgrest:8080; }
    location /rest/v1/ { proxy_pass http://nginx-postgrest:8080; }

    # The engine, without its prefix: /engine/v1/... is /v1/...
    location /engine/ {
        proxy_pass http://engine:8000/;
        proxy_buffering off;
    }

    # The dashboard (Next.js dev server, hot reload over a websocket)
    location / {
        proxy_pass http://ui:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
